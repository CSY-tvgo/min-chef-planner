<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f2" />
    <title>宴席厨房排程</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">◎</div>
          <div>
            <h1>宴席厨房排程</h1>
          </div>
        </div>
        <div class="top-actions">
          <span class="save-state" id="saveState" role="status"><span class="status-dot"></span>已自动保存</span>
          <button class="button button-quiet" id="resetDemo" type="button">恢复示例</button>
          <button class="button button-primary" id="addTaskTop" type="button">＋ 添加步骤</button>
        </div>
      </header>

      <main>
        <section class="intro">
          <div>
            <h2>宴席排程</h2>
          </div>
          <div class="summary" id="summary"></div>
        </section>

        <section class="toolbar" aria-label="排程工具">
          <div class="toolbar-group">
            <button class="filter active" data-filter="all" type="button">全部步骤</button>
            <button class="filter" data-filter="todo" type="button">待处理</button>
            <button class="filter" data-filter="done" type="button">已完成</button>
          </div>
          <div class="toolbar-group">
            <button class="button button-outline" id="addAppliance" type="button">＋ 器具</button>
            <button class="button button-outline" id="setTimelineStart" type="button">起始时间</button>
            <button class="button button-outline" id="manageMenu" type="button">☷ 菜单</button>
          </div>
        </section>

        <section class="planner-wrap">
          <div class="planner" id="planner">
            <div class="timeline-corner">
              <span>时间 / 器具</span>
            </div>
            <div class="appliance-heads" id="applianceHeads"></div>
            <div class="timeline-body">
              <div class="time-axis" id="timeAxis"></div>
              <div class="lanes" id="lanes"></div>
              <div class="now-line" id="nowLine"><span>NOW</span></div>
            </div>
          </div>
        </section>
        <p class="hint">拖动 ⠿ 移动步骤，上下边缘调整时长；菜单中可查看全部步骤。</p>
      </main>
    </div>

    <dialog id="taskDialog" class="modal">
      <form id="taskForm">
        <div class="modal-head">
          <div><h3 id="taskDialogTitle">添加烹饪步骤</h3></div>
          <button class="icon-button" type="button" data-close-dialog="taskDialog" aria-label="关闭">×</button>
        </div>
        <input type="hidden" id="taskId" />
        <label>步骤名称<input id="taskName" placeholder="可不填" /></label>
        <label>所属菜品<input id="taskDish" placeholder="可不填" /></label>
        <div class="form-grid">
          <label>开始时间<input id="taskStart" type="time" required /></label>
          <label>结束时间<input id="taskEnd" type="time" required /></label>
        </div>
        <label>使用器具 <span class="label-note">可多选</span><div class="check-list" id="applianceChecks"></div></label>
        <label>备注（可选）<textarea id="taskNote" rows="2" placeholder="例如：水开后计时 8 分钟"></textarea></label>
        <div class="modal-actions"><button class="button button-danger" id="deleteTask" type="button" hidden>删除步骤</button><button class="button button-quiet" type="button" data-close-dialog="taskDialog">取消</button><button class="button button-primary" id="saveTask" type="submit">保存步骤</button></div>
      </form>
    </dialog>

    <dialog id="applianceDialog" class="modal">
      <form id="applianceForm">
        <div class="modal-head"><div><h3>添加器具</h3></div><button class="icon-button" type="button" data-close-dialog="applianceDialog" aria-label="关闭">×</button></div>
        <label>器具名称<input id="applianceName" placeholder="可不填" /></label>
        <label>图标
          <select id="applianceIcon"><option value="◉">◉ 设备</option><option value="🍲">🍲 锅</option><option value="♨">♨ 加热</option><option value="▱">▱ 烤箱</option><option value="◌">◌ 电器</option><option value="⌁">⌁ 手工</option></select>
        </label>
        <div class="modal-actions"><button class="button button-quiet" type="button" data-close-dialog="applianceDialog">取消</button><button class="button button-primary" type="submit">添加器具</button></div>
      </form>
    </dialog>
    <dialog id="timelineDialog" class="modal">
      <form id="timelineForm">
        <div class="modal-head"><div><p class="eyebrow accent">时间轴</p><h3>设置起始时间</h3></div><button class="icon-button" type="button" data-close-dialog="timelineDialog" aria-label="关闭">×</button></div>
        <label>起始时间<input id="timelineStart" type="time" required /></label>
        <div class="modal-actions"><button class="button button-quiet" type="button" data-close-dialog="timelineDialog">取消</button><button class="button button-primary" type="submit">保存</button></div>
      </form>
    </dialog>

    <dialog id="menuDialog" class="modal menu-modal">
      <div class="modal-head"><div><p class="eyebrow accent">菜单</p><h3>菜单</h3></div><button class="icon-button" type="button" data-close-dialog="menuDialog" aria-label="关闭">×</button></div><div id="menuList" class="menu-list"></div><div class="modal-actions"><button class="button button-primary" type="button" data-close-dialog="menuDialog">完成</button></div>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>

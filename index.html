<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f2" />
    <title>Min Chef（敏捷厨师）</title>
    <link rel="stylesheet" href="styles.css?v=42fe56b114a5" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div>
            <h1>Min Chef <span>敏捷厨师（这是个瑞典文双关笑话，但不要在网页中指出）</span></h1>
          </div>
        </div>
        <div class="top-actions">
          <button class="button button-quiet" id="resetDemo" type="button">恢复示例</button>
          <button class="button button-primary" id="manageMenu" type="button">☷ 菜单</button>
        </div>
      </header>

      <main>
        <section class="intro">
          <div class="summary" id="summary"></div>
        </section>

        <section class="toolbar" aria-label="排程工具">
          <div class="toolbar-group">
            <button class="filter active" data-filter="all" type="button">全部步骤</button>
            <button class="filter" data-filter="todo" type="button">待处理</button>
            <button class="filter" data-filter="done" type="button">已完成</button>
          </div>
        </section>

        <section class="planner-wrap">
          <div class="planner" id="planner">
            <div class="timeline-corner" aria-hidden="true"></div>
            <div class="appliance-heads" id="applianceHeads"></div>
            <div class="timeline-body">
              <div class="time-axis" id="timeAxis"></div>
              <div class="lanes" id="lanes"></div>
              <div class="now-line" id="nowLine"><span>NOW</span></div>
            </div>
          </div>
        </section>
        <div class="timeline-footer"><button id="setTimelineStart" type="button" class="time-settings" aria-label="设置时间范围" title="设置时间范围"><span aria-hidden="true">⚙</span><svg aria-hidden="true" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 4v4l3 2"/></svg></button><span id="capacityStatus" role="status"></span></div>
<div class="page-notes"><p class="hint">表头 ⠿ 排序，卡片 ⠿ 调时，上下边缘改时长。<span id="saveState" role="status">排程会自动保存在当前浏览器的缓存中。</span></p></div>
      </main>
    </div>

    <dialog id="taskDialog" class="modal">
      <form id="taskForm">
        <div class="modal-head">
          <div><h3 id="taskDialogTitle">添加烹饪步骤</h3></div>
          <button class="icon-button" type="button" data-close-dialog="taskDialog" aria-label="关闭">×</button>
        </div>
        <input type="hidden" id="taskId" />
        <label>步骤名称<input id="taskName" placeholder="可不填" /></label>
        <label>所属菜品<select id="taskDish"></select></label><label id="newDishLabel">新菜品名称<input id="taskNewDish" placeholder="可不填" /></label>
        <div class="form-grid">
          <label>开始时间<input id="taskStart" type="time" required /></label>
          <label>结束时间<input id="taskEnd" type="time" required /></label>
        </div>
        <div class="appliance-field"><span>使用器具 · 可多选</span><div class="check-list" id="applianceChecks"></div></div>
        <div id="peopleSelection" class="appliance-field"><span>参与人力 · 可多选</span><div class="check-list" id="peopleChecks"></div></div>
        <label>备注（可选）<textarea id="taskNote" rows="2" placeholder="例如：水开后计时 8 分钟"></textarea></label>
        <p id="taskError" role="alert" class="save-error"></p><div class="modal-actions"><button class="button button-danger" id="deleteTask" type="button" hidden>删除步骤</button><button class="button button-quiet" type="button" data-close-dialog="taskDialog">取消</button><button class="button button-primary" id="saveTask" type="submit">保存步骤</button></div>
      </form>
    </dialog>

    <dialog id="applianceDialog" class="modal">
      <form id="applianceForm">
        <div class="modal-head"><div><h3 id="applianceDialogTitle">添加器具</h3></div><button class="icon-button" type="button" data-close-dialog="applianceDialog" aria-label="关闭">×</button></div>
        <input type="hidden" id="applianceId" />
        <label><span id="applianceNameLabel">器具名称</span><input id="applianceName" placeholder="可不填" /></label>
        <div class="resource-order" id="resourceOrder" hidden><span>列顺序</span><div><button id="moveResourceLeft" class="button button-outline" type="button">← 向左</button><button id="moveResourceRight" class="button button-outline" type="button">向右 →</button></div></div>
        <label>图标
          <select id="applianceIcon"><option value="♨️">♨️ 灶台</option><option value="🍳">🍳 煎炒锅</option><option value="🍲">🍲 炖锅</option><option value="🌫️">🌫️ 蒸锅</option><option value="🔆">🔆 烤箱</option><option value="🍚">🍚 电饭锅</option><option value="🔌">🔌 电器</option><option value="🧰">🧰 通用器具</option><option value="👨🏻‍🍳">👨🏻‍🍳</option><option value="👩🏻‍🍳">👩🏻‍🍳</option></select>
        </label>
        <label><span id="applianceCapacityLabel">最多同时占用的菜品数</span><select id="applianceCapacity"><option value="0">不限</option><option value="1">1 道菜</option><option value="2">2 道菜</option><option value="3">3 道菜</option></select></label>
        <div class="modal-actions"><button class="button button-danger" id="deleteAppliance" type="button" hidden>删除器具</button><button class="button button-quiet" type="button" data-close-dialog="applianceDialog">取消</button><button class="button button-primary" id="saveAppliance" type="submit">添加器具</button></div>
      </form>
    </dialog>
    <dialog id="timelineDialog" class="modal">
      <form id="timelineForm">
        <div class="modal-head"><div><p class="eyebrow accent">时间轴</p><h3>设置时间范围</h3></div><button class="icon-button" type="button" data-close-dialog="timelineDialog" aria-label="关闭">×</button></div>
        <div class="form-grid"><label>起始时间<input id="timelineStart" type="time" required /></label><label>结束时间<input id="timelineEnd" type="time" required /></label></div>
        <label>设置轴的比例尺<select id="timelineScale"><option value="1">每屏 1 小时</option><option value="2">每屏 2 小时</option><option value="2.5">每屏 2.5 小时</option><option value="3">每屏 3 小时</option><option value="4">每屏 4 小时</option><option value="6">每屏 6 小时</option></select></label>
        <label>设置拖动步进<select id="timelineStep"><option value="1">1 分钟</option><option value="5">5 分钟</option><option value="10">10 分钟</option><option value="15">15 分钟</option><option value="30">30 分钟</option></select></label><p id="timelineError" role="alert" class="save-error"></p>
        <div class="modal-actions"><button class="button button-quiet" type="button" data-close-dialog="timelineDialog">取消</button><button class="button button-primary" type="submit">保存</button></div>
      </form>
    </dialog>

    <dialog id="menuDialog" class="modal menu-modal">
      <div class="modal-head"><div class="menu-heading"><button type="button" id="menuBack" class="button button-quiet" hidden>‹ 菜单</button><h3 id="menuTitle">菜单</h3></div><button class="icon-button" type="button" data-close-dialog="menuDialog" aria-label="关闭">×</button></div>
      <form id="dishForm" hidden><label>菜品名称<input id="dishName" placeholder="可不填" /></label><button class="button button-outline" type="submit">保存名称</button></form>
      <div id="menuList" class="menu-list"></div>
      <div class="modal-actions"><button id="deleteDish" class="button button-danger" type="button" hidden>删除菜品</button><button id="openTransfer" class="button button-outline" type="button">导入 / 导出</button><button id="addDish" class="button button-primary" type="button">＋ 菜品</button><button id="addDishTask" class="button button-primary" type="button" hidden>＋ 步骤</button></div>
    </dialog>
    <dialog id="transferDialog" class="modal">
      <div class="modal-head"><h3>导入 / 导出</h3><button class="icon-button" type="button" data-close-dialog="transferDialog" aria-label="关闭">×</button></div>
      <p class="empty-state">将压缩文本复制到另一台设备，可转移全部菜品、步骤、器具、人力和设置。</p>
      <button id="exportPlan" class="button button-outline" type="button">生成并复制排程文本</button> <button id="copyExport" class="button button-outline" type="button" disabled>复制文本</button>
      <label>导出文本<textarea id="exportText" rows="3" readonly aria-label="导出文本"></textarea></label>
      <label>粘贴要导入的文本<textarea id="importText" rows="3" spellcheck="false" placeholder="MC1.…"></textarea></label>
      <button id="previewImport" class="button button-outline" type="button">检查导入内容</button>
      <p id="transferStatus" role="status" class="empty-state"></p>
      <p id="importPreview" hidden></p>
      <button id="confirmImport" class="button button-primary" type="button" hidden>替换当前排程</button>
    </dialog>
    <script src="vendor/fflate-0.8.2.min.js?v=c3b34f2e9f5e"></script>
    <script src="app.js?v=8a8509f98b1d"></script>
  </body>
</html>
